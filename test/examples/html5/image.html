<!-- .basic -->
<div class="image-block">
  <img alt="sunset" src="sunset.jpg">
</div>

<!-- .with-alt-text -->
<div class="image-block">
  <img alt="Shining sun" src="sunset.jpg">
</div>

<!-- .with-align -->
<div class="image-block" style="text-align: center">
  <img alt="sunset" src="sunset.jpg">
</div>

<!-- .with-float -->
<div class="image-block" style="float: right">
  <img alt="sunset" src="sunset.jpg">
</div>

<!-- .with-dimensions -->
<div class="image-block">
  <img alt="Shining sun" height="200" src="sunset.jpg" width="300">
</div>

<!-- .with-link -->
<div class="image-block">
  <a class="image" href="http://www.flickr.com/photos/javh/5448336655">
    <img alt="sunset" src="sunset.jpg">
  </a>
</div>

<!-- .with-title -->
<figure class="image-block">
  <img alt="sunset" src="sunset.jpg">
  <figcaption><span class="figure-caption-label">Figure 1. </span>A mountain sunset</figcaption>
</figure>

<!-- .with-id -->
<div class="image-block" id="img-sunset">
  <img alt="sunset" src="sunset.jpg">
</div>

<!-- .with-roles -->
<div class="image-block right text-center">
  <img alt="sunset" src="sunset.jpg">
</div>

<!-- .with-link-and-window-blank -->
<div class="image-block">
  <a class="image" href="http://www.flickr.com/photos/javh/5448336655" rel="noopener" target="_blank">
    <img alt="sunset" src="sunset.jpg">
  </a>
</div>

<!-- .with-link-and-noopener -->
<div class="image-block">
  <a class="image" href="http://www.flickr.com/photos/javh/5448336655" rel="noopener">
    <img alt="sunset" src="sunset.jpg">
  </a>
</div>

<!-- .with-link-and-nofollow -->
<div class="image-block">
  <a class="image" href="http://www.flickr.com/photos/javh/5448336655" rel="nofollow">
    <img alt="sunset" src="sunset.jpg">
  </a>
</div>

<!-- .with-link-self -->
<div class="image-block">
  <a aria-label="Open the image in full size" class="image bare" href="sunset.jpg" title="Open the image in full size">
    <img alt="sunset" src="sunset.jpg">
  </a>
</div>

<!-- .with-link-none -->
<div class="image-block">
  <img alt="sunset" src="sunset.jpg">
</div>

<!-- .with-loading-lazy -->
<div class="image-block">
  <img alt="sunset" loading="lazy" src="sunset.jpg">
</div>

<!-- .html5s-image-default-link-self -->
<div class="image-block">
  <a aria-label="Open the image in full size" class="image bare" href="sunset.jpg" title="Open the image in full size">
    <img alt="sunset" src="sunset.jpg">
  </a>
</div>

<!-- .html5s-image-default-link-self-with-link-none -->
<div class="image-block">
  <img alt="sunset" src="sunset.jpg">
</div>

<!-- .html5s-image-default-link-self-with-link-url -->
<div class="image-block">
  <a class="image" href="http://www.flickr.com/photos/javh/5448336655">
    <img alt="sunset" src="sunset.jpg">
  </a>
</div>

<!-- .svg-interactive -->
<div class="image-block">
  <object data="diagram.svg" type="image/svg+xml"><span class="alt">diagram</span></object>
</div>

<!-- .svg-interactive-with-fallback -->
<div class="image-block">
  <object data="diagram.svg" type="image/svg+xml"><img alt="Diagram" src="diagram.png"></object>
</div>

<!-- .svg-interactive-with-dimensions -->
<div class="image-block">
  <object data="diagram.svg" height="200" type="image/svg+xml" width="100"><span class="alt">diagram</span></object>
</div>

<!-- .svg-inline -->
<div class="image-block">
  <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><circle cx="5" cy="5" r="4"></circle></svg>
</div>
